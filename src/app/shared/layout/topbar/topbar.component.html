<header class="topbar">
  <div class="topbar__left">
    <button
      type="button"
      class="topbar__nav-toggle"
      [attr.aria-expanded]="mobileNavOpen()"
      aria-label="Toggle navigation"
      aria-controls="app-sidebar"
      (click)="toggleMobileNav()">
      <span class="topbar__nav-icon" aria-hidden="true"></span>
    </button>
    <div class="topbar__title">Welcome back</div>
  </div>
  <div class="topbar__user">
    <span class="topbar__username">{{ username() }}</span>
    <span class="badge">{{ role() }}</span>
    <button type="button" class="topbar__logout" (click)="logout()">Sign out</button>
  </div>
</header>
