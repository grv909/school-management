<header class="topbar">
  <div class="topbar__left">
    <button
      type="button"
      class="topbar__nav-toggle"
      [attr.aria-expanded]="mobileNavOpen()"
      aria-label="Toggle navigation"
      aria-controls="app-sidebar"
      (click)="toggleMobileNav()">
      <span class="topbar__nav-icon" aria-hidden="true"></span>
    </button>
  </div>
  <app-account-menu
    [username]="username()"
    [role]="role()"
    (logout)="logout()">
  </app-account-menu>
</header>
