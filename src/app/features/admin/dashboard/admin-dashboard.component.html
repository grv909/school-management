<app-page-header title="Dashboard" subtitle="At a glance — manage your school's records and reports."></app-page-header>

@if (loading()) {
  <app-skeleton variant="kpi-row" [rows]="6"></app-skeleton>
  <app-skeleton variant="card"></app-skeleton>
} @else if (isEmpty()) {
  <app-empty-state
    title="Nothing set up yet"
    hint="Start by adding your first class."
    actionLabel="Add a class"
    (action)="go('/admin/classes')">
  </app-empty-state>
} @else {
  <div class="kpi-grid">
    <app-stat-card label="Classes" [value]="stats().classes" [clickable]="true" (action)="go('/admin/classes')"></app-stat-card>
    <app-stat-card label="Students" [value]="stats().students" [clickable]="true" (action)="go('/admin/students')"></app-stat-card>
    <app-stat-card label="Teachers" [value]="stats().teachers" [clickable]="true" (action)="go('/admin/teachers')"></app-stat-card>
    <app-stat-card label="Subjects" [value]="stats().subjects" [clickable]="true" (action)="go('/admin/subjects')"></app-stat-card>
    <app-stat-card label="Exams" [value]="stats().exams" [clickable]="true" (action)="go('/admin/exams')"></app-stat-card>
    <app-stat-card label="Reports" value="PDF" [clickable]="true" (action)="go('/admin/reports')"></app-stat-card>
  </div>

  <div class="analytics-grid">
    <div class="card">
      <div class="card__title">Enrolment by class</div>
      <div class="card__subtitle">Number of students per class</div>
      <app-bar-chart [data]="enrolmentByClass()" ariaLabel="Enrolment by class"></app-bar-chart>
    </div>

    <div class="card">
      <div class="card__title">Average score by subject</div>
      <div class="card__subtitle">School-wide % across all exams</div>
      <app-bar-chart [data]="avgScoreBySubject()" [maxValue]="100" ariaLabel="Average score by subject"></app-bar-chart>
    </div>

    <div class="card">
      <div class="card__title">Attendance trend</div>
      <div class="card__subtitle">School-wide monthly attendance %</div>
      <app-line-chart [data]="attendanceTrend()" [maxValue]="100" [minValue]="70" ariaLabel="Attendance trend"></app-line-chart>
    </div>

    <div class="card">
      <div class="card__title">Gender distribution</div>
      <div class="card__subtitle">Current student body</div>
      <app-donut-chart [data]="genderDistribution()" caption="Students" ariaLabel="Gender distribution"></app-donut-chart>
    </div>
  </div>
}
