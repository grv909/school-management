<app-page-header title="Academic Years" subtitle="Define the academic year(s) sections and attendance are tracked against.">
  <button type="button" class="btn btn--primary" (click)="toggleForm()">
    {{ formOpen() ? 'Cancel' : 'Add academic year' }}
  </button>
</app-page-header>

@if (formOpen()) {
  <app-modal [wide]="true" title="New academic year" (close)="toggleForm()">
    <form (ngSubmit)="submit()">
      <div class="form-row">
        <div class="form-field">
          <label class="form-field__label" for="ay-name">Name</label>
          <input class="form-field__control" id="ay-name" name="ay-name" required
                 placeholder="e.g. 2026-27"
                 [ngModel]="form().name" (ngModelChange)="patch('name', $event)">
        </div>
        <div class="form-field">
          <label class="form-field__label" for="ay-start">Start date</label>
          <input class="form-field__control" id="ay-start" name="ay-start" type="date" required
                 [ngModel]="form().startDate" (ngModelChange)="patch('startDate', $event)">
        </div>
        <div class="form-field">
          <label class="form-field__label" for="ay-end">End date</label>
          <input class="form-field__control" id="ay-end" name="ay-end" type="date" required
                 [ngModel]="form().endDate" (ngModelChange)="patch('endDate', $event)">
        </div>
        <div class="form-field">
          <label class="form-field__label">&nbsp;</label>
          <label class="form-field__checkbox" for="ay-current">
            <input id="ay-current" name="ay-current" type="checkbox"
                   [ngModel]="form().current" (ngModelChange)="patch('current', $event)">
            Current year
          </label>
        </div>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn--tertiary" (click)="toggleForm()">Cancel</button>
        <button type="submit" class="btn btn--primary"
                [disabled]="!form().name.trim() || !form().startDate || !form().endDate">Save academic year</button>
      </div>
    </form>
  </app-modal>
}

@if (loading()) {
  <app-skeleton variant="table"></app-skeleton>
} @else if (years().length === 0) {
  <app-empty-state
    title="No academic years yet"
    hint="Add one before creating sections — every section belongs to an academic year."
    actionLabel="Add academic year"
    (action)="toggleForm()">
  </app-empty-state>
} @else {
  <div class="table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Start date</th>
          <th>End date</th>
          <th>Current</th>
          <th class="actions">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (y of years(); track y.id) {
          <tr>
            <td>{{ y.name }}</td>
            <td>{{ y.startDate }}</td>
            <td>{{ y.endDate }}</td>
            <td>{{ y.current ? 'Yes' : '—' }}</td>
            <td class="actions">
              <button type="button" class="btn btn--tertiary btn--sm" (click)="startEdit(y)">Edit</button>
              <button type="button" class="btn btn--tertiary btn--sm" (click)="remove(y)">Remove</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}

@if (editingId(); as id) {
  @if (yearById(id); as y) {
    <app-modal [wide]="true" title="Edit academic year" (close)="cancelEdit()">
      <form (ngSubmit)="saveEdit(y.id)">
        <div class="form-row">
          <div class="form-field">
            <label class="form-field__label" for="eay-name">Name</label>
            <input class="form-field__control" id="eay-name" name="eay-name" required
                   [ngModel]="editForm().name" (ngModelChange)="patchEdit('name', $event)">
          </div>
          <div class="form-field">
            <label class="form-field__label" for="eay-start">Start date</label>
            <input class="form-field__control" id="eay-start" name="eay-start" type="date" required
                   [ngModel]="editForm().startDate" (ngModelChange)="patchEdit('startDate', $event)">
          </div>
          <div class="form-field">
            <label class="form-field__label" for="eay-end">End date</label>
            <input class="form-field__control" id="eay-end" name="eay-end" type="date" required
                   [ngModel]="editForm().endDate" (ngModelChange)="patchEdit('endDate', $event)">
          </div>
          <div class="form-field">
            <label class="form-field__label">&nbsp;</label>
            <label class="form-field__checkbox" for="eay-current">
              <input id="eay-current" name="eay-current" type="checkbox"
                     [ngModel]="editForm().current" (ngModelChange)="patchEdit('current', $event)">
              Current year
            </label>
          </div>
        </div>
        <div class="modal__footer">
          <button type="button" class="btn btn--tertiary" (click)="cancelEdit()">Cancel</button>
          <button type="submit" class="btn btn--primary"
                  [disabled]="!editForm().name.trim() || !editForm().startDate || !editForm().endDate">Save</button>
        </div>
      </form>
    </app-modal>
  }
}
