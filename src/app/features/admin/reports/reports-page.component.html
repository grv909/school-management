<app-page-header title="Report Cards" subtitle="Select a student and exam to open the printable report card.">
</app-page-header>

<div class="card">
  <div class="form-row">
    <div class="form-field">
      <label class="form-field__label" for="rc-class">Class</label>
      <app-select id="rc-class" [options]="classOptions()"
              [ngModel]="selectedClassId()" (ngModelChange)="onClassChange($event)"></app-select>
    </div>
    <div class="form-field">
      <label class="form-field__label" for="rc-sec">Section</label>
      <app-select id="rc-sec" [options]="sectionOptions()"
              [ngModel]="selectedSectionId()" (ngModelChange)="onSectionChange($event)"
              [disabled]="!selectedClassId()"></app-select>
    </div>
    <div class="form-field">
      <label class="form-field__label" for="rc-stu">Student</label>
      <app-select id="rc-stu" [options]="studentOptions()"
              [ngModel]="selectedStudentId()" (ngModelChange)="selectedStudentId.set($event)"
              [disabled]="!selectedSectionId()"></app-select>
    </div>
    <div class="form-field">
      <label class="form-field__label" for="rc-exam">Exam</label>
      <app-select id="rc-exam" [options]="examOptions()"
              [ngModel]="selectedExamId()" (ngModelChange)="selectedExamId.set($event)"
              [disabled]="!selectedClassId()"></app-select>
    </div>
  </div>

  <button type="button" class="btn btn--primary"
          (click)="generate()"
          [disabled]="!selectedStudentId() || !selectedExamId()">
    Open report card
  </button>

  @if (!selectedStudentId() || !selectedExamId()) {
    <p class="form-field__hint">Select a class, section, student, and exam to generate a report card.</p>
  }
</div>
