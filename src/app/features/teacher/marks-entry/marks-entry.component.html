<app-page-header title="Marks Entry" subtitle="Pick a class, section, subject and exam — then enter marks below.">
  <button type="button" class="btn btn--primary"
          (click)="save()"
          [disabled]="rows().length === 0 || saving()">
    {{ saving() ? 'Saving…' : 'Save all' }}
  </button>
</app-page-header>

<div class="card">
  <div class="marks-entry__filters">
    <div class="marks-entry__filter">
      <label for="me-class">Class</label>
      <select id="me-class" [ngModel]="selectedClassId()" (ngModelChange)="onClassChange($event)">
        <option [ngValue]="null">Select</option>
        @for (c of classes(); track c.id) { <option [ngValue]="c.id">{{ c.name }}</option> }
      </select>
    </div>
    <div class="marks-entry__filter">
      <label for="me-sec">Section</label>
      <select id="me-sec" [disabled]="!selectedClassId()"
              [ngModel]="selectedSectionId()" (ngModelChange)="onSectionChange($event)">
        <option [ngValue]="null">Select</option>
        @for (s of sections(); track s.id) { <option [ngValue]="s.id">Section {{ s.name }}</option> }
      </select>
    </div>
    <div class="marks-entry__filter">
      <label for="me-sub">Subject</label>
      <select id="me-sub" [disabled]="!selectedSectionId()"
              [ngModel]="selectedSubjectId()" (ngModelChange)="selectedSubjectId.set($event)">
        <option [ngValue]="null">Select</option>
        @for (s of subjects(); track s.id) { <option [ngValue]="s.id">{{ s.name }}</option> }
      </select>
    </div>
    <div class="marks-entry__filter">
      <label for="me-exam">Exam</label>
      <select id="me-exam" [ngModel]="selectedExamId()" (ngModelChange)="selectedExamId.set($event)">
        <option [ngValue]="null">Select</option>
        @for (e of exams(); track e.id) { <option [ngValue]="e.id">{{ e.name }}</option> }
      </select>
    </div>
    <div class="marks-entry__filter">
      <label>&nbsp;</label>
      <button type="button" class="btn btn--secondary" (click)="loadGrid()" [disabled]="!canLoad()">Load students</button>
    </div>
  </div>
</div>

@if (rows().length === 0) {
  <div class="empty-state">
    <div class="empty-state__title">Nothing loaded yet</div>
    <div class="empty-state__hint">Choose the filters above and click "Load students".</div>
  </div>
} @else {
  <div class="table-container">
    <table class="marks-grid">
      <thead>
        <tr>
          <th class="num">Roll</th>
          <th>Student</th>
          <th class="num">Max</th>
          <th class="num">Marks obtained</th>
        </tr>
      </thead>
      <tbody>
        @for (r of rows(); track r.studentId) {
          <tr>
            <td class="num">{{ r.rollNo ?? '—' }}</td>
            <td>{{ r.firstName }} {{ r.lastName }}</td>
            <td class="num">{{ r.maxMarks }}</td>
            <td class="num">
              <input type="number" min="0" [max]="maxMarks()" step="0.5"
                     class="marks-grid__input"
                     [class.marks-grid__input--dirty]="dirtyStudentIds().has(r.studentId)"
                     [ngModel]="r.marksObtained"
                     (ngModelChange)="updateMark(r.studentId, $event)">
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
