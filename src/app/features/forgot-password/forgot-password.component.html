<div class="login-page">
  <div class="login-card">
    <div class="login-card__brand">School ERP</div>
    <div class="login-card__subtitle">Reset your password</div>

    @if (!submitted()) {
      <form (ngSubmit)="submit()" autocomplete="off">
        <div class="form-field">
          <label class="form-field__label" for="usernameOrEmail">Username or email</label>
          <input class="form-field__control"
                 id="usernameOrEmail"
                 name="usernameOrEmail"
                 type="text"
                 autocomplete="username"
                 [ngModel]="usernameOrEmail()"
                 (ngModelChange)="usernameOrEmail.set($event)"
                 placeholder="Enter your username or email"
                 required>
        </div>

        <button type="submit"
                class="btn btn--primary login-card__submit"
                [disabled]="!usernameOrEmail().trim()">
          Send reset link
        </button>
      </form>
    } @else {
      <div class="form-field__hint" role="status">
        If an account matches, we've sent a password reset link to it. Check your inbox
        (including spam) for further instructions.
      </div>
    }

    <div class="login-card__footer">
      <a routerLink="/login">Back to sign in</a>
    </div>
  </div>
</div>
